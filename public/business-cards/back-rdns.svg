<svg xmlns="http://www.w3.org/2000/svg" width="88mm" height="58mm" viewBox="0 0 880 580" role="img" aria-labelledby="title desc">
  <title id="title">RDNS business card back with website QR code</title>
  <desc id="desc">Shared print-ready back artwork for RDNS business cards with a QR code linking to rdns.ie.</desc>
  <defs>
